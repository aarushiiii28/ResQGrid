[project]
name = "resqgrid"
version = "0.1.0"
description = "ResQGrid: simulated emergency dispatch prototype (synthetic data only)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "ortools>=9.10",
    "pyyaml>=6",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
evm = ["web3>=7"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["backend", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501", "B008", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"backend/app/services/false_alarm_model.py" = ["E702"]  # seeded scenario tables read better one signal per clause

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

